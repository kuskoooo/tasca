<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#EEF0F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14172B" media="(prefers-color-scheme: dark)">
<title>Tasca – MiniCPM5 in locale</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0F7; --surface:#FFFFFF; --ink:#1E2340; --muted:#6A6F8C;
  --accent:#3D4FD8; --accent-ink:#FFFFFF; --line:#D8DBEA; --think:#E3E6F5; --err:#B3261E; --warn:#8A5A00;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#14172B; --surface:#1D2140; --ink:#E6E8F5; --muted:#9A9FC0;
    --accent:#8C9BFF; --accent-ink:#14172B; --line:#2E3358; --think:#232850; --err:#FF8A80; --warn:#F2C26B;
    color-scheme: dark;
  }
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Bricolage Grotesque",-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
  font-size:16px; line-height:1.5;
  display:flex; flex-direction:column; overflow:hidden;
}
button{font:inherit;cursor:pointer}
button:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

header{display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--line)}
header h1{font-size:20px;font-weight:800;margin:0;letter-spacing:-0.02em;flex:1;min-width:0}
header h1 small{display:block;font-size:12px;font-weight:400;color:var(--muted);letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ghost{background:none;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:6px 12px;font-size:14px;white-space:nowrap}
.ghost:disabled{opacity:.4}

/* Avvio */
#boot{flex:1;overflow-y:auto;padding:24px;-webkit-overflow-scrolling:touch}
#boot .wrap{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;justify-content:center}
#boot .big{font-size:clamp(56px,18vw,96px);font-weight:800;line-height:.9;letter-spacing:-0.05em;margin:0 0 8px;font-variant-numeric:tabular-nums}
#boot .big span{font-size:.35em;letter-spacing:-0.02em;color:var(--muted);font-weight:600}
#boot p{color:var(--muted);margin:0 0 20px;max-width:42ch}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.field label{font-size:14px;color:var(--muted)}
.field small{font-size:13px;color:var(--muted)}
.field small.warn{color:var(--warn)}
select{font:inherit;font-size:16px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;max-width:100%}
.track{height:10px;background:var(--line);border-radius:5px;overflow:hidden;margin:6px 0 10px}
.fill{height:100%;width:0;background:var(--accent);transition:width .3s}
#status{font-size:13px;color:var(--muted);min-height:2.6em;margin-bottom:16px;word-break:break-word}
#status.error{color:var(--err)}
.primary{background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:16px 20px;font-size:17px;font-weight:600;width:100%}
.primary:disabled{opacity:.5}
.row-inline{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px;font-size:14px;color:var(--muted)}
.linkbtn{background:none;border:0;color:var(--accent);text-decoration:underline;padding:4px 0;font-size:14px}

/* Chat */
#chat{flex:1;display:none;flex-direction:column;min-height:0}
#log{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
.inner{max-width:720px;margin:0 auto}
.empty{color:var(--muted);text-align:center;margin-top:28vh}
.msg{margin:0 0 18px}
.msg.user{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.msg.user .bubble{background:var(--accent);color:var(--accent-ink);padding:10px 14px;border-radius:18px 18px 4px 18px;max-width:85%;white-space:pre-wrap;word-break:break-word}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:4px 10px;font-size:13px;max-width:85%}
.chip b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip button{background:none;border:0;color:var(--muted);font-size:16px;padding:0 2px;line-height:1}
.msg.bot .bubble{word-break:break-word}
.msg.bot .bubble p{margin:0 0 .7em}
.msg.bot .bubble p:last-child{margin-bottom:0}
.bubble pre{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;overflow-x:auto;font-size:13px;position:relative}
.bubble code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9em}
.copy{position:absolute;top:6px;right:6px;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:8px;font-size:12px;padding:2px 8px}
details.think{background:var(--think);border-radius:10px;padding:8px 12px;margin-bottom:10px;font-size:14px;color:var(--muted)}
details.think summary{cursor:pointer;font-weight:600}
details.think div{white-space:pre-wrap;margin-top:6px;max-height:40vh;overflow-y:auto}
.cursor::after{content:"▍";animation:blink 1s steps(1) infinite;color:var(--accent)}
@keyframes blink{50%{opacity:0}}
.meta{font-size:12px;color:var(--muted);margin-top:4px}

#composer{border-top:1px solid var(--line);padding:8px 12px 10px;background:var(--bg)}
#composer .inner{display:flex;flex-direction:column;gap:6px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.toggle{display:flex;align-items:center;gap:6px}
.toggle input{width:18px;height:18px;accent-color:var(--accent)}
#usage.full{color:var(--warn)}
.row{display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;resize:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:20px;padding:10px 14px;font:inherit;font-size:16px;max-height:160px}
.round{border:0;border-radius:50%;width:44px;height:44px;flex:none;font-size:20px;font-weight:800}
#attach{background:var(--surface);color:var(--ink);border:1px solid var(--line);font-size:22px;font-weight:400}
#send{background:var(--accent);color:var(--accent-ink)}
#send:disabled{opacity:.4}
#pending{display:none}
@media (prefers-reduced-motion: reduce){.fill{transition:none}.cursor::after{animation:none}}
</style>
</head>
<body>

<header>
  <h1>Tasca<small id="subtitle">MiniCPM5 sul tuo dispositivo</small></h1>
  <button class="ghost" id="settingsBtn" disabled>Modello</button>
  <button class="ghost" id="newChat" disabled>Nuova chat</button>
</header>

<section id="boot">
  <div class="wrap">
    <div class="big" id="pct">1,4<span> GB</span></div>
    <p id="intro">Il modello si scarica una volta sola e poi resta salvato nel browser. Usa il Wi‑Fi.</p>

    <div class="field">
      <label for="modelSel">Modello</label>
      <select id="modelSel">
        <option value="2b">MiniCPM5-2B, 1,4 GB (più bravo)</option>
        <option value="1b">MiniCPM5-1B, 0,7 GB (più leggero)</option>
      </select>
    </div>
    <div class="field">
      <label for="ctxSel">Memoria della chat</label>
      <select id="ctxSel"></select>
      <small id="ctxNote"></small>
    </div>

    <div class="track"><div class="fill" id="fill"></div></div>
    <div id="status">Controllo il supporto WebGPU…</div>
    <button class="primary" id="loadBtn" disabled>Scarica e avvia</button>

    <div class="row-inline">
      <label for="backend">Salva in</label>
      <select id="backend">
        <option value="cache">Cache del browser</option>
        <option value="indexeddb">IndexedDB</option>
        <option value="opfs">File privati (OPFS)</option>
      </select>
      <button class="linkbtn" id="clearBtn">Libera spazio</button>
    </div>
  </div>
</section>

<section id="chat">
  <div id="log"><div class="inner" id="msgs"><div class="empty" id="empty">Scrivi qualcosa o allega un file per iniziare.</div></div></div>
  <div id="composer">
    <div class="inner">
      <div class="bar">
        <label class="toggle"><input type="checkbox" id="thinkToggle"> Ragiona prima di rispondere</label>
        <span id="usage"></span>
      </div>
      <div id="pending"></div>
      <div class="row">
        <button class="round" id="attach" aria-label="Allega file">+</button>
        <input type="file" id="fileInput" hidden
          accept=".html,.htm,.css,.js,.mjs,.ts,.jsx,.tsx,.json,.txt,.md,.csv,.xml,.svg,.py,.java,.c,.cpp,.h,.cs,.php,.rb,.go,.rs,.sql,.yml,.yaml,.ini,.log,text/*">
        <textarea id="input" rows="1" placeholder="Scrivi un messaggio"></textarea>
        <button class="round" id="send" aria-label="Invia">↑</button>
      </div>
    </div>
  </div>
</section>

<script type="module">
import * as webllm from "https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.85/+esm";

/* ---------- Modelli e memoria ---------- */
const MODELS = {
  "2b": {
    id: "MiniCPM5-2B-q4f16_1-MLC", name: "MiniCPM5-2B", size: "1,4",
    weightsGB: 1.42, kvKBPerToken: 43, temp: { think: 1.0, plain: 1.0 },
  },
  "1b": {
    id: "MiniCPM5-1B-q4f16_am-MLC", name: "MiniCPM5-1B", size: "0,7",
    weightsGB: 0.70, kvKBPerToken: 24.6, temp: { think: 0.9, plain: 0.7 },
  },
};
const OVERHEAD_GB = 0.35; // memoria di lavoro della GPU oltre a pesi e conversazione
const CONTEXTS = [4096, 8192, 16384, 32768];

const appConfig = {
  model_list: [
    {
      model: "https://huggingface.co/ozhyhinas/MiniCPM5-2B-q4f16_1-MLC",
      model_id: "MiniCPM5-2B-q4f16_1-MLC",
      model_lib: "https://huggingface.co/ozhyhinas/MiniCPM5-2B-q4f16_1-MLC/resolve/main/libs/MiniCPM5-2B-q4f16_1-MLC-webgpu.wasm",
      vram_required_MB: 1900,
      low_resource_required: true,
      required_features: ["shader-f16"],
      overrides: { context_window_size: 4096 },
    },
    {
      model: "https://huggingface.co/CharlZKP/MiniCPM5-1B-MLC/resolve/main/MiniCPM5-1B-q4f16_am-MLC",
      model_id: "MiniCPM5-1B-q4f16_am-MLC",
      model_lib: "https://huggingface.co/CharlZKP/MiniCPM5-1B-MLC/resolve/main/libs/MiniCPM5-1B-q4f16_am_cs1k-webgpu.wasm",
      vram_required_MB: 884,
      low_resource_required: true,
      required_features: ["shader-f16"],
      overrides: { context_window_size: 4096 },
    },
  ],
  cacheBackend: "cache",
};

const ua = navigator.userAgent;
const IS_PHONE = /iPhone|iPod|Android|Mobile/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
// Chrome/Edge espongono la RAM approssimata (massimo 8); gli altri browser no
const RAM_GB = navigator.deviceMemory || null;

// Quanta memoria grafica possiamo usare senza rischiare crash
function memoryBudgetGB() {
  if (IS_PHONE) return 1.6; // su iPhone il 2B a 4k (circa 1,9 GB) già a volte crasha
  if (RAM_GB && RAM_GB < 8) return 1.8;
  return 2.6; // PC con 8 GB di RAM (spesso con scheda grafica integrata che condivide la RAM)
}
function estimateGB(m, ctx) { return m.weightsGB + (m.kvKBPerToken * ctx) / 1e6 + OVERHEAD_GB; }
function fmtNum(n, d = 1) { return n.toFixed(d).replace(".", ","); }
function ctxLabel(ctx) { return Math.round(ctx / 1024) + "k"; }
function pagesFor(ctx) { return Math.round(ctx * 0.62 / 500); } // ~0,62 parole per token, 500 parole a pagina

/* ---------- Riferimenti alla pagina ---------- */
const $ = id => document.getElementById(id);
const boot = $("boot"), chat = $("chat"), loadBtn = $("loadBtn"), statusEl = $("status");
const fill = $("fill"), pct = $("pct"), msgs = $("msgs"), log = $("log");
const input = $("input"), sendBtn = $("send"), newChatBtn = $("newChat"), settingsBtn = $("settingsBtn");
const thinkToggle = $("thinkToggle"), modelSel = $("modelSel"), ctxSel = $("ctxSel"), ctxNote = $("ctxNote");
const backendSel = $("backend"), usageEl = $("usage"), pendingEl = $("pending"), fileInput = $("fileInput");

let engine = null, history = [], busy = false, pendingFile = null;
let current = MODELS["2b"], CTX = 4096;

function save(k, v) { try { localStorage.setItem(k, v); } catch {} }
function load(k) { try { return localStorage.getItem(k); } catch { return null; } }
function setStatus(text, isError = false) { statusEl.textContent = text; statusEl.classList.toggle("error", isError); }

/* ---------- Impostazioni iniziali ---------- */
{
  const m = load("tasca-model");
  modelSel.value = m && MODELS[m] ? m : (IS_PHONE ? "1b" : "2b");
  const b = load("tasca-backend");
  if (b) backendSel.value = b;
  appConfig.cacheBackend = backendSel.value;
}

function fillContextOptions() {
  current = MODELS[modelSel.value];
  const budget = memoryBudgetGB();
  const saved = parseInt(load("tasca-ctx-" + modelSel.value) || "0", 10);
  ctxSel.innerHTML = "";
  let best = 4096;
  for (const ctx of CONTEXTS) {
    const gb = estimateGB(current, ctx);
    const fits = gb <= budget;
    // sul telefono non mostriamo le opzioni che lo farebbero crashare
    if (IS_PHONE && !fits && ctx > 4096) continue;
    if (fits) best = ctx;
    const o = document.createElement("option");
    o.value = ctx;
    o.textContent = ctxLabel(ctx) + " token, circa " + pagesFor(ctx) + " pagine (" + fmtNum(gb) + " GB di memoria)" + (fits ? "" : ", al limite");
    ctxSel.appendChild(o);
  }
  const options = [...ctxSel.options].map(o => +o.value);
  ctxSel.value = options.includes(saved) ? saved : best;
  updateCtxNote();
}
function updateCtxNote() {
  CTX = +ctxSel.value;
  const gb = estimateGB(current, CTX);
  const budget = memoryBudgetGB();
  const ramTxt = IS_PHONE ? "Su telefono" : (RAM_GB ? "Con circa " + RAM_GB + " GB di RAM" : "Con 8 GB di RAM");
  if (gb > budget) {
    ctxNote.textContent = ramTxt + " questa scelta può far chiudere la pagina a conversazione piena. Se succede, scendi di un livello.";
    ctxNote.className = "warn";
  } else {
    ctxNote.textContent = "Usa memoria solo mentre la pagina è aperta, non occupa spazio sul disco. " + ramTxt + " va bene.";
    ctxNote.className = "";
  }
}

modelSel.addEventListener("change", () => { save("tasca-model", modelSel.value); fillContextOptions(); checkSupport(); });
ctxSel.addEventListener("change", () => { save("tasca-ctx-" + modelSel.value, ctxSel.value); updateCtxNote(); });
backendSel.addEventListener("change", () => { appConfig.cacheBackend = backendSel.value; save("tasca-backend", backendSel.value); checkSupport(); });

/* ---------- Spazio e compatibilità ---------- */
async function clearAllStorage() {
  try { for (const k of await caches.keys()) await caches.delete(k); } catch {}
  try { if (indexedDB.databases) for (const db of await indexedDB.databases()) if (db.name) indexedDB.deleteDatabase(db.name); } catch {}
  try { const root = await navigator.storage.getDirectory(); for await (const n of root.keys()) await root.removeEntry(n, { recursive: true }); } catch {}
}

async function checkSupport() {
  loadBtn.disabled = true;
  if (!window.isSecureContext) { setStatus("Questa pagina va aperta da un indirizzo https, non da un file locale.", true); return false; }
  if (!navigator.gpu) { setStatus("WebGPU non è disponibile. Su PC usa Chrome o Edge aggiornati; su iPhone Safari con iOS 26 o successivo.", true); return false; }
  try {
    const adapter = await navigator.gpu.requestAdapter();
    if (!adapter) throw new Error("nessuna scheda grafica trovata");
    if (!adapter.features.has("shader-f16")) { setStatus("La scheda grafica non supporta shader-f16, che serve a questi modelli.", true); return false; }
  } catch (e) { setStatus("WebGPU non risponde: " + e.message, true); return false; }

  try { await navigator.storage?.persist?.(); } catch {}
  let freeNote = "";
  try {
    const est = await navigator.storage.estimate();
    if (est.quota) {
      const free = est.quota - (est.usage || 0);
      freeNote = " Spazio disponibile per questo sito: circa " + fmtNum(free / 1e9) + " GB.";
    }
  } catch {}
  let cached = false;
  try { cached = await webllm.hasModelInCache(current.id, appConfig); } catch {}
  if (cached) {
    loadBtn.textContent = "Avvia";
    pct.innerHTML = "Pronto";
    $("intro").textContent = current.name + " è già salvato qui. Si avvia senza scaricare niente.";
    setStatus("Modello trovato in memoria.");
  } else {
    loadBtn.textContent = "Scarica e avvia";
    pct.innerHTML = current.size + "<span> GB</span>";
    $("intro").textContent = "Il modello si scarica una volta sola e poi resta salvato nel browser. Usa il Wi‑Fi.";
    setStatus("Tutto ok. Tieni la pagina aperta durante il download." + freeNote);
  }
  loadBtn.disabled = false;
  return true;
}

/* ---------- Caricamento ---------- */
loadBtn.addEventListener("click", async () => {
  loadBtn.disabled = modelSel.disabled = ctxSel.disabled = backendSel.disabled = true;
  CTX = +ctxSel.value;
  const record = appConfig.model_list.find(r => r.model_id === current.id);
  record.overrides = { ...record.overrides, context_window_size: CTX };
  setStatus("Avvio…");
  const MAX_TRIES = 20;
  let attempt = 1;
  try {
    while (true) {
      try {
        engine = await webllm.CreateMLCEngine(current.id, {
          appConfig,
          initProgressCallback: (r) => {
            const p = Math.round((r.progress || 0) * 100);
            fill.style.width = p + "%";
            pct.innerHTML = p + "<span> %</span>";
            setStatus((attempt > 1 ? "Tentativo " + attempt + ": " : "") + r.text);
          },
        });
        break;
      } catch (err) {
        const m = String(err.message || err);
        if (/file system|write|quota|load failed|network/i.test(m) && attempt < MAX_TRIES) {
          attempt++;
          setStatus("Download interrotto, riprendo (tentativo " + attempt + " di " + MAX_TRIES + ")…");
          await new Promise(r => setTimeout(r, 2000));
          continue;
        }
        throw err;
      }
    }
    $("subtitle").textContent = current.name + ", memoria " + ctxLabel(CTX);
    boot.style.display = "none";
    chat.style.display = "flex";
    newChatBtn.disabled = settingsBtn.disabled = false;
    updateUsage();
    input.focus();
  } catch (e) {
    console.error(e);
    const m = String(e.message || e);
    let hint = "";
    if (/file system|quota|storage|write|database|cannot fetch/i.test(m)) hint = " Il browser non è riuscito a salvare il modello: prova un altro archivio in “Salva in”.";
    else if (/memory|oom|device lost|lost|buffer/i.test(m)) hint = " Memoria insufficiente: scegli una memoria della chat più bassa o il modello 1B, e chiudi le altre schede.";
    setStatus("Caricamento non riuscito: " + m + hint, true);
    loadBtn.textContent = "Riprova";
    loadBtn.disabled = modelSel.disabled = ctxSel.disabled = backendSel.disabled = false;
  }
});

// Torna alla scelta del modello liberando la memoria
settingsBtn.addEventListener("click", async () => {
  if (busy) engine?.interruptGenerate();
  try { await engine?.unload(); } catch {}
  engine = null;
  resetChatUI();
  chat.style.display = "none";
  boot.style.display = "block";
  newChatBtn.disabled = settingsBtn.disabled = true;
  modelSel.disabled = ctxSel.disabled = backendSel.disabled = false;
  fill.style.width = "0";
  $("subtitle").textContent = "MiniCPM5 sul tuo dispositivo";
  checkSupport();
});

$("clearBtn").addEventListener("click", async () => {
  setStatus("Cancello i dati salvati…");
  await clearAllStorage();
  fill.style.width = "0";
  await checkSupport();
});

/* ---------- Token: stime ---------- */
// Stima prudente: circa 3 caratteri per token tra italiano e codice
const estTokens = s => Math.ceil(s.length / 3);
function maxAnswerTokens() { return CTX <= 4096 ? 1800 : CTX <= 8192 ? 3000 : 4096; }
function inputBudget() { return CTX - maxAnswerTokens() - 300; }

const SYSTEM = "Sei un assistente utile. Rispondi sempre in italiano, in modo chiaro e conciso. Quando scrivi codice, mettilo in un unico blocco ``` completo.";

// Tiene i messaggi più recenti che stanno nella memoria
function buildMessages() {
  const budget = inputBudget() - estTokens(SYSTEM);
  const out = [];
  let used = 0;
  for (let i = history.length - 1; i >= 0; i--) {
    const t = estTokens(history[i].content);
    if (used + t > budget && out.length > 0) break;
    out.unshift(history[i]);
    used += t;
  }
  return { messages: [{ role: "system", content: SYSTEM }, ...out], used, dropped: history.length - out.length };
}
function updateUsage(extra = 0) {
  const all = history.reduce((a, m) => a + estTokens(m.content), 0) + extra;
  const shown = Math.min(all, CTX);
  usageEl.textContent = "Memoria: circa " + shown.toLocaleString("it-IT") + " di " + CTX.toLocaleString("it-IT") + " token";
  usageEl.classList.toggle("full", all > inputBudget());
}

/* ---------- Allegati ---------- */
$("attach").addEventListener("click", () => fileInput.click());
fileInput.addEventListener("change", async () => {
  const f = fileInput.files[0];
  fileInput.value = "";
  if (!f) return;
  if (f.size > 2_000_000) { alert("Il file è troppo grande (più di 2 MB)."); return; }
  if (/^image\//.test(f.type) && !/svg/.test(f.type)) { alert("Questo modello legge solo testo: non può vedere le immagini."); return; }
  const text = await f.text();
  if (/\u0000/.test(text.slice(0, 2000))) { alert("Questo file non è di testo, il modello non può leggerlo."); return; }
  const tokens = estTokens(text);
  pendingFile = { name: f.name, text, tokens, lines: text.split("\n").length };
  renderPending();
});
function renderPending() {
  if (!pendingFile) { pendingEl.style.display = "none"; pendingEl.innerHTML = ""; updateUsage(); return; }
  const tooBig = pendingFile.tokens > inputBudget();
  pendingEl.style.display = "block";
  pendingEl.innerHTML = "";
  const chip = document.createElement("span");
  chip.className = "chip";
  chip.innerHTML = "<b></b><span></span><button aria-label='Rimuovi allegato'>×</button>";
  chip.querySelector("b").textContent = pendingFile.name;
  chip.querySelector("span").textContent = pendingFile.lines + " righe, circa " + pendingFile.tokens.toLocaleString("it-IT") + " token" + (tooBig ? ", troppo grande per la memoria scelta" : "");
  chip.querySelector("button").onclick = () => { pendingFile = null; renderPending(); };
  pendingEl.appendChild(chip);
  updateUsage(pendingFile.tokens);
}
function langOf(name) {
  const ext = (name.split(".").pop() || "").toLowerCase();
  return ({ htm: "html", mjs: "js", yml: "yaml" })[ext] || ext;
}

/* ---------- Messaggi ---------- */
function escapeHtml(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;"); }
function renderMarkdown(src) {
  return src.split(/```/).map((part, i) => {
    if (i % 2 === 1) {
      const code = part.replace(/^[^\n]*\n/, "");
      return "<pre><button class='copy'>Copia</button><code>" + escapeHtml(code) + "</code></pre>";
    }
    const h = escapeHtml(part).replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    return h.split(/\n{2,}/).filter(p => p.trim()).map(p => "<p>" + p.replace(/\n/g, "<br>") + "</p>").join("");
  }).join("");
}
msgs.addEventListener("click", e => {
  const b = e.target.closest(".copy");
  if (!b) return;
  navigator.clipboard?.writeText(b.parentElement.querySelector("code").textContent).then(() => {
    b.textContent = "Copiato";
    setTimeout(() => (b.textContent = "Copia"), 1500);
  });
});

function splitThinking(text, thinkingOn, done) {
  const open = text.indexOf("<think>"), close = text.indexOf("</think>");
  if (close !== -1) {
    const start = open !== -1 && open < close ? open + 7 : 0;
    return { think: text.slice(start, close).trim(), answer: text.slice(close + 8).trim(), thinking: false };
  }
  if (open !== -1) return { think: text.slice(open + 7).trim(), answer: "", thinking: true };
  if (thinkingOn && !done) return { think: text.trim(), answer: "", thinking: true };
  return { think: "", answer: text.trim(), thinking: false };
}

function addUser(text, file) {
  $("empty")?.remove();
  const el = document.createElement("div");
  el.className = "msg user";
  if (file) {
    const chip = document.createElement("span");
    chip.className = "chip";
    chip.innerHTML = "<b></b><span></span>";
    chip.querySelector("b").textContent = file.name;
    chip.querySelector("span").textContent = file.lines + " righe";
    el.appendChild(chip);
  }
  if (text) {
    const b = document.createElement("div");
    b.className = "bubble";
    b.textContent = text;
    el.appendChild(b);
  }
  msgs.appendChild(el);
  log.scrollTop = log.scrollHeight;
}
function addBot() {
  const el = document.createElement("div");
  el.className = "msg bot";
  el.innerHTML = '<details class="think" hidden><summary>Ragionamento</summary><div></div></details><div class="bubble cursor"></div><div class="meta">Sto leggendo il messaggio…</div>';
  el.querySelector("summary").addEventListener("click", () => { el.querySelector("details").dataset.touched = "1"; });
  msgs.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}
function updateBot(el, text, thinkingOn, done) {
  const { think, answer, thinking } = splitThinking(text, thinkingOn, done);
  const det = el.querySelector("details"), bubble = el.querySelector(".bubble");
  if (think) {
    det.hidden = false;
    const words = think.split(/\s+/).filter(Boolean).length;
    det.querySelector("summary").textContent = thinking ? "Sta ragionando… (" + words + " parole finora)" : "Ragionamento (" + words + " parole)";
    det.querySelector("div").textContent = think;
    if (!det.dataset.touched) det.open = thinking;
  }
  bubble.innerHTML = renderMarkdown(answer);
  bubble.classList.toggle("cursor", !done);
  return answer;
}
function scrollDown() {
  if (log.scrollHeight - log.scrollTop - log.clientHeight < 160) log.scrollTop = log.scrollHeight;
}

// Riconosce quando il modello ripete la stessa frase in loop
function isLooping(text) {
  if (text.length < 120) return false;
  const inCode = (text.split("```").length - 1) % 2 === 1;
  const tail = text.slice(inCode ? -1500 : -400);
  const limit = inCode ? 15 : 4;
  for (const n of [12, 20, 30, 45]) {
    const piece = text.slice(-n);
    if (piece.trim().length < 6) continue;
    if (tail.split(piece).length - 1 >= limit) return true;
  }
  return false;
}
function trimLoop(text) {
  for (const n of [45, 30, 20, 12]) {
    const piece = text.slice(-n);
    const first = text.indexOf(piece);
    if (first !== -1 && first + n < text.length - n) return text.slice(0, first + n);
  }
  return text;
}

/* ---------- Invio ---------- */
async function send() {
  if (busy) { engine?.interruptGenerate(); return; }
  const text = input.value.trim();
  if ((!text && !pendingFile) || !engine) return;

  let content = text;
  const file = pendingFile;
  if (file) {
    content = (text || "Ecco un file, dimmi cosa contiene.") + "\n\nFile allegato: " + file.name + "\n```" + langOf(file.name) + "\n" + file.text + "\n```";
    if (estTokens(content) > inputBudget()) {
      alert("Il file è troppo grande per la memoria della chat (" + ctxLabel(CTX) + "). Tocca “Modello” e scegli una memoria più grande, oppure allega solo una parte del file.");
      return;
    }
  }

  input.value = ""; autoGrow();
  pendingFile = null; renderPending();
  addUser(text, file);
  history.push({ role: "user", content });

  const thinkingOn = thinkToggle.checked;
  const { messages, dropped } = buildMessages();
  const el = addBot();
  busy = true;
  sendBtn.textContent = "■"; sendBtn.setAttribute("aria-label", "Ferma");

  let full = "", looped = false, tokens = 0;
  const t0 = performance.now();
  try {
    const stream = await engine.chat.completions.create({
      messages,
      stream: true,
      temperature: thinkingOn ? current.temp.think : current.temp.plain,
      top_p: 0.95,
      repetition_penalty: 1.1,
      frequency_penalty: 0.3,
      max_tokens: maxAnswerTokens(),
      extra_body: { enable_thinking: thinkingOn },
    });
    for await (const chunk of stream) {
      const d = chunk.choices[0]?.delta?.content || "";
      if (!d) continue;
      full += d; tokens++;
      if (tokens === 1) el.querySelector(".meta").textContent = "";
      if (isLooping(full)) { looped = true; engine.interruptGenerate(); break; }
      updateBot(el, full, thinkingOn, false);
      scrollDown();
    }
    if (looped) full = trimLoop(full);
    const answer = updateBot(el, full, thinkingOn, true);
    history.push({ role: "assistant", content: answer || full });
    const secs = (performance.now() - t0) / 1000;
    let meta = fmtNum(tokens / secs) + " token/s";
    if (looped) meta += ". Fermato perché si stava ripetendo.";
    if (dropped > 0) meta += ". I messaggi più vecchi non entrano più nella memoria.";
    el.querySelector(".meta").textContent = meta;
  } catch (e) {
    console.error(e);
    updateBot(el, full, thinkingOn, true);
    const m = String(e.message || e);
    el.querySelector(".meta").textContent = /context/i.test(m)
      ? "Conversazione troppo lunga per la memoria scelta. Premi Nuova chat."
      : /lost|memory|oom/i.test(m)
        ? "Memoria della scheda grafica esaurita. Tocca Modello e scegli una memoria più bassa."
        : "Errore: " + m;
    history.pop();
  } finally {
    busy = false;
    sendBtn.textContent = "↑"; sendBtn.setAttribute("aria-label", "Invia");
    updateUsage();
  }
}

sendBtn.addEventListener("click", send);
input.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey && !IS_PHONE) { e.preventDefault(); send(); }
});
function autoGrow() { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 160) + "px"; }
input.addEventListener("input", autoGrow);

function resetChatUI() {
  history = [];
  pendingFile = null; renderPending();
  msgs.innerHTML = '<div class="empty" id="empty">Scrivi qualcosa o allega un file per iniziare.</div>';
}
newChatBtn.addEventListener("click", async () => {
  if (busy) engine?.interruptGenerate();
  try { await engine?.resetChat(); } catch {}
  resetChatUI();
  updateUsage();
});

fillContextOptions();
checkSupport();
</script>
